<!-- Write an HTML code to analyse the user's data from the FORM considering GET and POST methods. -->

<!DOCTYPE html>
<html>

<head>
    <title>Form Analysis</title>
</head>

<body>
    <h1>Form Analysis</h1>

    <form method="get">
        <p>Enter-Your-Name :-- <input type="text" name="name"></p>
        <p>Enter------Section :-- <input type="text" name="section"></p>
        <p>Enter----SerialNo :-- <input type="text" name="serial"></p>
        <p>Enter------Branch   :-- <input type="text" name="branch"></p>
        <input type="submit" value="Submit (GET)">
    </form>

    <form method="post">
        <p>Enter-Your-Name :-- <input type="text" name="name"></p>
        <p>Enter------Section :-- <input type="text" name="section"></p>
        <p>Enter----SerialNo :-- <input type="text" name="serial"></p>
        <p>Enter------Branch   :-- <input type="text" name="branch"></p>
        <input type="submit" value="Submit (POST)">
    </form>

</body>

</html>
