<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: auto;
            overflow: hidden;
        }

        .Login {
            position: relative;
            top: -100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            filter: none;
        }

        .ImageHold {
            filter: blur(5px);
            background-image: url("./img/Login.jpg");
            background-repeat: no-repeat;
            height: 100vh;
            width: 41.5vw;
            background-size: cover;
        }

        .ImageHold>img {
            width: 100vw;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        table {
            border-collapse: collapse;
            width: 95%;
            margin: 20px;
            padding: 30px;
            position: relative;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            display: block;
            margin: 0 auto;
            color: white;
            width: 90%;
            background-color: blue;
            border: none;
            cursor: pointer;
            border-radius: 60px;
            height: 10%;
        }

        button:hover {
            background-color: #45a049;
        }

        .Change .gender-options {
            display: flex;
            flex-direction: row;
            padding: 10px;
        }

        .gender-options>input {
            width: 5%;
        }

        hr {
            width: 10%;
            height: 7px;
            background-color: blue;
            border-radius: 20px;
            margin: 30px;
        }

        .language-selector>select {
            border-radius: 50px;
            width: 36px;
            position: absolute;
            top: 10%;
            right: 25%;
            background-color: blue;
            color: white;
        }

        .Container1 {
            position: absolute;
            top: 10%;
            right: 22%;
            background-color: white;
            height: 33px;
            width: 34px;
            border-radius: 20px;
            border: 1px solid grey;

        }

        select::-ms-expand {
            display: none;
        }

        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
</head>

<body>
    <div class="ImageHold">
    </div>
    <div class="Login">
        <div class="Image">
            <img src="./img/Login.jpg" alt="Login Index" height="600" width="300">
        </div>
        <div class="Container">
            <div class="language-selector">
                <select id="language-select">
                    <label for="language-select">EN</label>
                    <option value="en">EN</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                </select>
            </div>
            <div class="Container1">
                <img src="./img/Login.jpg" alt="Logo" height="25" width="25" style="border-radius: 50px;
    position: absolute;
    left: 14%;
    top: 10%;">
            </div>
            <h1 style="margin: 30px;">Registeration</h1>
            <hr>
            <table>
                <tr>
                    <th>Full Name</th>
                    <th>Position You Are Applying For</th>
                </tr>
                <tr>
                    <td><input type="text" id="fullName" placeholder="Please Enter Your Full Name"></td>
                    <td>
                        <select id="position">
                            <option value="">-- Please Select --</option>
                            <option value="option1">MERN Developer</option>
                            <option value="option2">Full Stack Developer</option>
                            <option value="option3">Android Developer</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>Email</th>
                    <th>Phone Number</th>
                </tr>
                <tr>
                    <td><input type="email" id="email" placeholder="Email"></td>
                    <td><input type="tel" id="phoneNumber" placeholder="Phone Number"></td>
                </tr>
                <tr>
                    <th>Country</th>
                    <th>City</th>
                </tr>
                <tr>
                    <td><input type="text" id="country" placeholder="Please Enter Your Country"></td>
                    <td><input type="text" id="city" placeholder="Please Enter Your City"></td>
                </tr>
                <tr>
                    <th>Password</th>
                    <th>Confirm Password</th>
                </tr>
                <tr>
                    <td><input type="password" id="password" placeholder="Please Enter Password"></td>
                    <td><input type="password" id="confirmPassword" placeholder="Please Enter Password Again"></td>
                </tr>
                <tr>
                    <th>Gender</th>
                </tr>
                <tr class="Change">
                    <td>
                        <div class="gender-options">
                            <input type="radio" id="male" name="gender" value="male">
                            <label for="male">Male</label>
                            <input type="radio" id="female" name="gender" value="female">
                            <label for="female">Female</label>
                            <input type="radio" id="other" name="gender" value="other">
                            <label for="other">Other</label>
                            <input type="radio" id="preferNotToSay" name="gender" value="preferNotToSay">
                            <label for="preferNotToSay">Prefer Not To Say</label>
                        </div>
                    </td>
                </tr>
            </table>
            <button>
                <p>
                    <b style="font-size: 15px;position:relative;top:-5px;">Next Step</b>
                    <img src="./img/Arrrow.png" alt="Arrow" style="position: relative; left:35%; filter: invert(1);">
                </p>
            </button>
            <p style="margin: 30px;">Already Have An Account? <a href="Index-1.html"
                    style="color: rgb(80, 117, 191);">Sign In</a></p>
        </div>
    </div>
</body>

</html>
