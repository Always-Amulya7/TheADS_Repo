<!DOCTYPE html>
<html>

<head>
    <title>Student Report</title>
    <style>
        p {
            display: flex;
            justify-content: center;
        }

        table {
            width: 100%;
            border: 1px solid black;
        }

        th,
        td {
            text-align: center;
            padding: 8px;
        }

        /*tr:nth-child(even) {

        }*/

        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>

    </caption>

</body>

</html>
