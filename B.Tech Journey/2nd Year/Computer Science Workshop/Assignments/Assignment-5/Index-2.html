<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index-2</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th,
        td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .btn-edit {
            color: white;
            background-color: green;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-delete {
            color: white;
            background-color: red;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1 style="display: flex;justify-content:center;">Student Information</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Semester</th>
                <th>Registration Number</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentTable">
            <tr>
                <td>Amulya Shrivastava</td>
                <td>20</td>
                <td>3</td>
                <td>2341019456</td>
                <td>
                    <button class="btn-edit">Edit</button>
                    <button class="btn-delete">Delete</button>
                </td>
            </tr>
            <tr>
                <td>Ashish Kaushal</td>
                <td>20</td>
                <td>8</td>
                <td>2001458516</td>
                <td>
                    <button class="btn-edit">Edit</button>
                    <button class="btn-delete">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
    <script>
        $(document).ready(function() {
            $(".btn-edit").click(function() {
                var row = $(this).closest("tr");
                var name = prompt("Edit Name", row.find("td:eq(0)").text());
                if (name) row.find("td:eq(0)").text(name);
            });
            $(".btn-delete").click(function() {
                if (confirm("Are you sure you want to delete this row?")) {
                    $(this).closest("tr").remove();
                }
            });
        });
    </script>
</body>
</html>
