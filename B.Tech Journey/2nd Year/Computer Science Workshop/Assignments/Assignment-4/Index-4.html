<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Index-4</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
    <style>
        *{
            overflow: hidden;
        }
    </style>
    <script>
        $(document).ready(function () {
            $(".container").mouseenter(function () {
                $(".alert").fadeOut(5000);
            })
        })
    </script>
</head>
<body>
    <h1 style="display: flex;justify-content:center;">Bootstrap Alerts</h1>
    <div class="container">
        <div class="alert alert-success alert-dismissible fade show"><em>Success</em> To Visit SOA University.
            <button type="button" class="close" data-dismiss="alert">&times;</button>
        </div>
        <div class="alert alert-info alert-dismissible"><em>Info</em> To Visit SOA University.
            <button type="button" class="close">&times;</button>
        </div>
        <div class="alert alert-warning"><em>Warning</em> To Visit SOA University.
            <button type="button" class="close">&times;</button>
        </div>
        <div class="alert alert-danger"><em>Danger</em> To Visit SOA University.
            <button class="close">&times;</button>
        </div>
        <div class="alert alert-primary"><em>Primary</em> To Visit SOA University.
            <button class="close">&times;</button>
        </div>
        <div class="alert alert-secondary"><em>Secondary</em> SOA University.
            <button class="close">&times;</button>
        </div>
    </div>
</body>
</html>
