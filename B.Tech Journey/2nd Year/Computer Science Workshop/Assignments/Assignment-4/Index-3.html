<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index-3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .thumbnail {
            width: 200px;
            height: 200px;
            transition: all 0.3s ease;
        }

        .circular {
            border-radius: 50%;
        }

        .container {
            display: block;
            justify-content: center;
            margin-top: 30vh;
        }
    </style>
</head>

<body>
    <div class="container text-center mt-5">
        <div class="row">
            <div class="col">
                <img src="./img/Login.jpg" alt="Thumbnail 1" class="thumbnail img-thumbnail" id="img1">
            </div>
            <div class="col">
                <img src="./img/Login.jpg" alt="Thumbnail 2" class="thumbnail img-thumbnail" id="img2">
            </div>
            <div class="col">
                <img src="./img/Login.jpg" alt="Thumbnail 3" class="thumbnail img-thumbnail" id="img3">
            </div>
        </div>
        <button class="btn btn-primary mt-3" onclick="makeCircular()">Make Circular</button>
    </div>
    <script>
        function makeCircular() {
            $(".thumbnail").toggleClass("circular");
        }
    </script>
</body>

</html>
