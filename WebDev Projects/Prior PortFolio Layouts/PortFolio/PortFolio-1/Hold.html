<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .service>ul {
      margin: 15px;
      padding: 15px;
      display: flex;
      list-style: none;
    }

    .service-item {
      margin: 25px;
      padding: 15px;
      width: 180px;
      height: 70px;
    }

    .service-item-text {
      position: relative;
      top: -9px;
      width: 193px;
      text-align: -webkit-auto;
      letter-spacing: normal;
      word-spacing: normal;
    }
  </style>
</head>

<body>
  <section class="service">
    <h3 class="h3 service-title">What I'm Doing</h3>
    <ul class="service-list">
      <li class="service-item">
        <div class="service-icon-box"><img src="img/images/icon-design.svg" alt="design icon" width="35" style="position:relative;top:-6px;"></div>
        <div class="service-content-box" style="position: relative;
    top: -58px;
    left: 50px;">
          <h4 class="h4 service-item-title">Web Design</h4>
          <p class="service-item-text">The most modern and high-quality design made at a professional level.</p>
        </div>
      </li>
      <li class="service-item">
        <div class="service-icon-box"><img src="img/images/icon-dev.svg" alt="Web development icon" width="35"></div>
        <div class="service-content-box" style="position: relative;
        top: -50px;
        left: 50px;">
          <h4 class="h4 service-item-title">Web Development</h4>
          <p class="service-item-text">High-quality development of websites at the professional level.</p>
        </div>
      </li>
      <li class="service-item">
        <div class="service-icon-box"><img src="img/images/icon-photo.svg" alt="camera icon" width="35"></div>
        <div class="service-content-box" style="position: relative;
        top: -50px;
        left: 50px;">
          <h4 class="h4 service-item-title">Photography</h4>
          <p class="service-item-text">I make high-quality photos of any category at a professional level.</p>
        </div>
      </li>
    </ul>
  </section>

</html>
